<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Memory Practice (Dynamic)</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      background: #ffffff;
      color: #333;
    }
    h1 { 
      text-align: center; 
      color: #1e3a8a; 
      margin-bottom: 5px;
    }
    .status-bar {
      text-align: center;
      font-size: 0.85em;
      color: #6b7280;
      margin-bottom: 20px;
      height: 20px;
    }
    h2 { 
      color: #2563eb; 
      margin-bottom: 8px; 
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* --- Controls --- */
    .controls { 
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      margin: 15px auto; 
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      max-width: 800px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e2e8f0;
      padding: 5px 10px;
      border-radius: 6px;
    }
    input[type="number"] {
      border: 1px solid #cbd5e1;
      padding: 5px;
      border-radius: 4px;
      width: 50px;
      text-align: center;
      font-weight: bold;
    }
    button { 
      padding: 8px 14px; 
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    
    #btn-reset { background: #dc2626; } /* Red */
    #btn-copy { background: #2563eb; } /* Blue */
    #btn-download { background: #16a34a; } /* Green */
    #btn-regen { background: #b91c1c; border: 1px solid #991b1b; } /* Dark Red */
    .btn-secondary { background: #64748b; font-size: 0.9em; }

    ul { list-style: none; padding: 0; }
    
    /* --- UPDATED LIST ITEM STYLING --- */
    li { 
      display: inline-block; 
      margin: 5px; 
      padding: 8px 14px; /* Slightly larger padding */
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
      cursor: pointer;
      background: #ffffff;
      transition: all 0.1s;
      user-select: none;
      
      /* Font & Texture Updates */
      font-family: Arial, sans-serif; /* Clean standard font */
      font-size: 18px;                /* Consistent large size */
      font-weight: 500;               /* Solid visual weight */
      letter-spacing: 0.5px;          /* Better readability */
      color: #334155;                 /* Dark grey for good contrast */
    }
    li:hover { 
      background: #e2e8f0; 
      border-color: #94a3b8;
    }
    li:active { transform: scale(0.95); }
    
    .completed { 
      background: #bbf7d0 !important; 
      color: #065f46 !important; 
      font-weight: bold;
      border-color: #86efac;
    }

    .set { 
      margin-top: 25px; 
      padding: 15px; 
      background: #f1f5f9; 
      border-radius: 8px; 
      border: 1px solid #e2e8f0;
    }
    .counter { 
      font-size: 0.9em;
      font-weight: normal; 
      color: #16a34a;
      background: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }
    .btn-set-reset { 
      background: white; 
      border: 1px solid #9ca3af; 
      border-radius: 4px; 
      padding: 4px 8px; 
      color: #374151;
      font-size: 0.75em;
      margin-left: auto;
    }
    .btn-set-reset:hover {
      background: #fee2e2;
      color: #991b1b;
      opacity: 1;
    }

    @media print {
      .controls, .btn-set-reset, .status-bar { display: none; }
      body { background: white; }
      .set { border: 1px solid #ddd; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<h1>Memory Practice (Cloud + Regen)</h1>
<div class="status-bar" id="statusIndicator">Connecting to cloud...</div>

<div class="controls">
  <div style="width: 100%; text-align: center; margin-bottom: 10px; color: #1e3a8a; font-weight: bold;" id="globalCounter">
    Loading...
  </div>
  
  <button id="btn-reset">Reset Progress</button>
  <button id="btn-copy" class="btn-secondary">Copy Data</button>
  <button id="btn-download" class="btn-secondary">Download</button>
  
  <div class="control-group">
    <label for="itemCount" style="font-size: 0.9em; color: #333;">Items:</label>
    <input type="number" id="itemCount" value="50" min="10" max="200">
    <button id="btn-regen">Regenerate All</button>
  </div>
</div>

<div id="setsContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getFirestore, 
    doc, 
    onSnapshot, 
    setDoc, 
    updateDoc 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdTht0Qu-J_SJSzotwM6fMYR4PAFVj63s",
    authDomain: "mind-training-f1b2b.firebaseapp.com",
    projectId: "mind-training-f1b2b",
    storageBucket: "mind-training-f1b2b.firebasestorage.app",
    messagingSenderId: "1021385760984",
    appId: "1:1021385760984:web:154f647b1fc90c34fef7ad",
    measurementId: "G-CVNPF4YL6B"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Using "v2_dynamic" to keep your data separate
  const DOC_ID = "memory_practice_v2_dynamic";
  const docRef = doc(db, "memory_practice", DOC_ID);

  const container = document.getElementById("setsContainer");
  const statusIndicator = document.getElementById("statusIndicator");
  const globalCounter = document.getElementById("globalCounter");
  const inputCount = document.getElementById("itemCount");

  // --- HELPER: DATA GENERATION ---
  
  function generateRandomNumberString(digits) {
    let result = '';
    result += Math.floor(Math.random() * 9) + 1; // No leading zero
    for (let i = 1; i < digits; i++) {
      result += Math.floor(Math.random() * 10);
    }
    return result;
  }

  function generateNewDataset(count) {
    const categories = [
      "2-digit", "3-digit", "4-digit", "5-digit", 
      "6-digit", "7-digit", "8-digit", "9-digit", "10-digit"
    ];
    
    const newDataset = {};
    categories.forEach(cat => {
      const digits = parseInt(cat.split('-')[0]);
      const list = [];
      for(let i=0; i<count; i++) {
        list.push(generateRandomNumberString(digits));
      }
      newDataset[cat] = list;
    });

    return {
      dataset: newDataset,
      completed: {} 
    };
  }

  // --- CLOUD SYNC ---

  let currentData = null;

  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      statusIndicator.textContent = "Synced with cloud";
      statusIndicator.style.color = "#16a34a";
      
      const fullData = docSnap.data();
      currentData = fullData.dataset;
      
      // --- FIX: SYNC INPUT BOX WITH ACTUAL DATA COUNT ---
      // We check the length of the '2-digit' array to see how many items exist
      if (currentData && currentData['2-digit']) {
        const actualCount = currentData['2-digit'].length;
        if (actualCount > 0) {
           inputCount.value = actualCount;
        }
      }
      
      renderAll(fullData.dataset, fullData.completed || {});
    } else {
      statusIndicator.textContent = "Initializing database...";
      const initialData = generateNewDataset(50);
      setDoc(docRef, initialData);
    }
  }, (error) => {
    console.error("Firebase Error:", error);
    statusIndicator.textContent = "Error connecting to cloud.";
    statusIndicator.style.color = "#dc2626";
  });

  function renderAll(dataset, completedMap) {
    container.innerHTML = "";
    let totalItems = 0;
    let totalDone = 0;

    const order = ["2-digit", "3-digit", "4-digit", "5-digit", "6-digit", "7-digit", "8-digit", "9-digit", "10-digit"];

    order.forEach(setKey => {
      const items = dataset[setKey];
      if (!items) return;

      totalItems += items.length;
      let sectionDone = 0;

      const div = document.createElement("div");
      div.className = "set";
      div.id = `section-${setKey}`;

      // Header
      const title = document.createElement("h2");
      title.innerHTML = `${setKey} <button class="btn-set-reset" id="reset-${setKey}">Reset</button>`;
      
      const counterDiv = document.createElement("div");
      counterDiv.className = "counter";
      
      const ul = document.createElement("ul");
      
      items.forEach((num, index) => {
        const li = document.createElement("li");
        li.textContent = num;
        
        const uid = `${setKey}-${index}`;
        li.dataset.uid = uid;

        if (completedMap[uid]) {
          li.classList.add("completed");
          sectionDone++;
        }

        li.addEventListener("click", () => toggleItem(uid, li));
        ul.appendChild(li);
      });

      totalDone += sectionDone;
      counterDiv.textContent = `${sectionDone} / ${items.length}`;

      title.appendChild(counterDiv);
      div.appendChild(title);
      div.appendChild(ul);
      container.appendChild(div);

      div.querySelector(`#reset-${setKey}`).addEventListener("click", () => resetSection(setKey, items.length));
    });

    globalCounter.textContent = `Total Completed: ${totalDone} / ${totalItems}`;
  }

  // --- ACTIONS ---

  async function toggleItem(uid, li) {
    const isNowComplete = !li.classList.contains("completed");
    if(isNowComplete) li.classList.add("completed");
    else li.classList.remove("completed");

    await updateDoc(docRef, {
      [`completed.${uid}`]: isNowComplete
    });
  }

  async function resetSection(setKey, count) {
    if(!confirm(`Reset ${setKey}?`)) return;
    const updates = {};
    for(let i=0; i<count; i++) {
      updates[`completed.${setKey}-${i}`] = false;
    }
    await updateDoc(docRef, updates);
  }

  async function resetAllProgress() {
    if(!confirm("Reset ALL progress? Numbers will stay the same.")) return;
    await updateDoc(docRef, { completed: {} });
  }

  async function regenerateAll() {
    const count = parseInt(inputCount.value) || 50;
    if(!confirm(`WARNING: This will generate NEW numbers (${count} per section) and WIPE progress for everyone.`)) return;
    
    statusIndicator.textContent = "Regenerating...";
    const newData = generateNewDataset(count);
    await setDoc(docRef, newData);
  }

  // --- EXPORT ---

  window.copyAll = function() {
    if(!currentData) return;
    let text = "";
    const order = ["2-digit", "3-digit", "4-digit", "5-digit", "6-digit", "7-digit", "8-digit", "9-digit", "10-digit"];
    order.forEach(key => {
      if(currentData[key]) {
        text += key + ":\n" + currentData[key].join(" ") + "\n\n";
      }
    });
    navigator.clipboard.writeText(text);
    alert("Copied to clipboard!");
  }

  window.downloadTxt = function() {
    if(!currentData) return;
    let text = "";
    const order = ["2-digit", "3-digit", "4-digit", "5-digit", "6-digit", "7-digit", "8-digit", "9-digit", "10-digit"];
    order.forEach(key => {
      if(currentData[key]) {
        text += key + ":\n" + currentData[key].join(" ") + "\n\n";
      }
    });
    const blob = new Blob([text], {type: "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "memory_sets.txt";
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById('btn-reset').addEventListener('click', resetAllProgress);
  document.getElementById('btn-regen').addEventListener('click', regenerateAll);
  document.getElementById('btn-copy').addEventListener('click', window.copyAll);
  document.getElementById('btn-download').addEventListener('click', window.downloadTxt);

</script>

</body>
</html>
