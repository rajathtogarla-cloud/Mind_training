<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cloud Mixed Practice (Expand/Collapse)</title>
  <style>
    /* --- COLOR VARIABLES --- */
    :root {
      /* DEFAULT: PITCH BLACK MODE */
      --bg-body: #000000;       
      --text-main: #e0e0e0;
      --text-dim: #9e9e9e;
      
      --accent-primary: #90caf9; 
      --accent-secondary: #e0e0e0;
      
      --bg-card: #000000;       
      --border-card: #333;      
      
      --bg-input-group: #111;   
      --bg-input: #222;
      --border-input: #444;
      
      --bg-header: #0a0a0a;     
      --bg-header-hover: #1a1a1a;
      
      --li-bg: #000000;
      --li-border: #444;
      --li-hover: #111;
      
      /* Status Colors */
      --status-connected: #00e676; 
      --status-error: #ff1744;
      
      /* Completed State */
      --completed-bg: #1b5e20;
      --completed-text: #a5d6a7;
      --completed-border: #2e7d32;

      /* Button Colors */
      --btn-bg-audio: #111;
      --btn-text-audio: #b0bec5;
      --btn-active-bg: #1565c0;
      
      --counter-bg: #111;
      --counter-text: #69f0ae;
    }

    /* LIGHT MODE OVERRIDES */
    body.light-mode {
      --bg-body: #ffffff;
      --text-main: #333333;
      --text-dim: #6b7280;
      
      --accent-primary: #1e3a8a; 
      --accent-secondary: #2563eb;
      
      --bg-card: #f8fafc;
      --border-card: #e2e8f0;
      
      --bg-input-group: #e2e8f0;
      --bg-input: #ffffff;
      --border-input: #cbd5e1;
      
      --bg-header: #eef2ff;
      --bg-header-hover: #e0e7ff;
      
      --li-bg: #ffffff;
      --li-border: #cbd5e1;
      --li-hover: #e2e8f0;
      
      --status-connected: #16a34a;
      --status-error: #dc2626;
      
      --completed-bg: #bbf7d0;
      --completed-text: #065f46;
      --completed-border: #86efac;
      
      --btn-bg-audio: #e2e8f0;
      --btn-text-audio: #64748b;
      --btn-active-bg: #3b82f6;
      
      --counter-bg: #ffffff;
      --counter-text: #16a34a;
    }

    body { 
      font-family: Arial, sans-serif; 
      margin: 10px; 
      background: var(--bg-body);
      color: var(--text-main);
      -webkit-text-size-adjust: 100%;
      transition: background 0.3s, color 0.3s;
    }

    h1 { 
      text-align: center; 
      color: var(--accent-primary); 
      margin-bottom: 10px;
      font-size: 1.5em;
    }

    .status-bar {
      text-align: center;
      font-size: 0.85em;
      color: var(--text-dim);
      margin-bottom: 15px;
      height: 20px;
    }
    
    /* --- Controls --- */
    .controls { 
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      margin: 10px auto; 
      padding: 15px;
      background: var(--bg-card);
      border-radius: 8px;
      max-width: 900px;
      border: 1px solid var(--border-card);
      position: relative; 
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-input-group);
      padding: 8px 12px;
      border-radius: 6px;
    }

    label { color: var(--text-main); font-size: 0.9em; }

    input[type="number"] {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-input);
      padding: 8px;
      border-radius: 4px;
      width: 60px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }
    
    /* Theme Toggle Button */
    .btn-theme {
      background: transparent;
      border: 1px solid var(--border-input);
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 1.2em;
      margin-left: 10px;
      line-height: 1;
    }
    .btn-theme:hover { background: var(--bg-header-hover); }

    button { 
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: white; 
      font-size: 14px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    
    #btn-reset { background: #b71c1c; } 
    #btn-copy { background: #1565c0; } 
    #btn-download { background: #2e7d32; } 
    #btn-regen { background: #c62828; border: 1px solid #8e0000; } 
    .btn-secondary { background: #546e7a; }
    
    /* NEW: Expand/Collapse Buttons */
    .btn-view-control {
      background: #424242;
      color: #fff;
    }
    body.light-mode .btn-view-control {
      background: #94a3b8;
    }

    /* --- SECTION STYLING --- */
    .set { 
      margin-top: 15px; 
      background: var(--bg-card);
      border-radius: 8px; 
      border: 1px solid var(--border-card);
      overflow: hidden; 
    }
    
    .set-header {
      padding: 12px 10px;
      background: var(--bg-header); 
      display: flex;
      align-items: center;
      flex-wrap: nowrap; 
      justify-content: space-between;
      gap: 8px;
      cursor: pointer; 
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background 0.2s;
    }
    .set-header:hover { background: var(--bg-header-hover); }
    
    .set.expanded .set-header { border-bottom: 1px solid var(--border-card); }

    /* Arrow icon */
    .chevron {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-right: 3px solid var(--accent-secondary);
      border-bottom: 3px solid var(--accent-secondary);
      transform: rotate(45deg); 
      transition: transform 0.2s;
      margin-right: 5px;
      margin-bottom: 3px;
      flex-shrink: 0;
    }
    .set.collapsed .chevron { transform: rotate(45deg) rotate(-90deg); }

    .set-title-text {
      color: var(--accent-secondary); 
      font-weight: bold;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      white-space: nowrap; 
      flex-grow: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .set-content { padding: 15px; display: block; }
    .set.collapsed .set-content { display: none; }

    ul { list-style: none; padding: 0; text-align: center; margin: 0; }
    
    li { 
      display: inline-block;
      margin: 6px; 
      padding: 12px 16px; 
      border: 1px solid var(--li-border); 
      border-radius: 8px; 
      background: var(--li-bg);
      transition: all 0.1s;
      user-select: none;
      cursor: pointer;
      font-family: "Courier New", Courier, monospace; 
      font-size: 18px; 
      font-weight: 600;               
      color: var(--text-main);     
      box-shadow: 0 1px 2px rgba(255,255,255,0.05); 
    }
    li:active { transform: scale(0.96); }
    
    li.completed { 
      background: var(--completed-bg) !important;
      color: var(--completed-text) !important;
      border-color: var(--completed-border);
      box-shadow: none;
    }

    /* Small Header Elements */
    .counter { 
      font-family: Arial, sans-serif;
      font-size: 0.8em;
      font-weight: normal; 
      color: var(--counter-text);
      background: var(--counter-bg);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-input);
      white-space: nowrap;
      margin-left: auto;
    }

    .btn-set-reset { 
      background: var(--bg-input); 
      border: 1px solid var(--border-input);
      border-radius: 4px; 
      padding: 6px 10px; 
      color: var(--text-main);
      font-size: 0.8em;
      white-space: nowrap;
    }
    .btn-set-reset:hover { background: var(--bg-header-hover); }

    .btn-audio-toggle {
      background: var(--btn-bg-audio);
      border: 1px solid var(--border-input);
      color: var(--btn-text-audio);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-audio-toggle.active {
      background: var(--btn-active-bg);
      color: white;
      border-color: var(--btn-active-bg);
    }

    @media (max-width: 600px) {
      .controls { flex-direction: column; width: 90%; }
      .control-group { width: 100%; justify-content: center; }
      .controls button:not(.btn-theme) { width: 100%; margin-bottom: 5px; }
      
      li { width: 90%; margin: 8px auto; text-align: center; font-size: 20px; display: block; }
      .set-header { gap: 5px; }
      .set-title-text { font-size: 1em; }
      .btn-audio-toggle, .btn-set-reset { width: auto; font-size: 0.7em; padding: 4px 8px; }
      .counter { font-size: 0.7em; padding: 3px 6px; }
    }
  </style>
</head>
<body>

<h1>Mixed Combinations</h1>
<div class="status-bar" id="statusIndicator">Connecting to cloud...</div>

<div class="controls">
  <div style="width: 100%; text-align: center; margin-bottom: 10px; color: var(--accent-primary); font-weight: bold;" id="globalCounter">
    Loading...
  </div>
  
  <button id="btn-reset">Reset Progress</button>

  <div style="display:flex; gap:5px; width:100%;">
    <button id="btn-expand" class="btn-view-control" style="flex:1;">Expand All</button>
    <button id="btn-collapse" class="btn-view-control" style="flex:1;">Collapse All</button>
  </div>

  <div style="display:flex; gap:5px; width:100%;">
    <button id="btn-copy" class="btn-secondary" style="flex:1;">Copy</button>
    <button id="btn-download" class="btn-secondary" style="flex:1;">Download</button>
  </div>
  
  <div class="control-group">
    <label for="speakSpeed">Speed:</label>
    <input type="range" id="speakSpeed" min="0.5" max="1.5" step="0.1" value="0.9">
  </div>
  
  <div class="control-group">
    <label for="itemCount">Items:</label>
    <input type="number" id="itemCount" value="50" min="10" max="200">
  </div>
  
  <div style="display: flex; width: 100%; gap: 10px;">
    <button id="btn-regen" style="flex: 1;">Regenerate</button>
    <button id="btn-theme" class="btn-theme" title="Switch Theme">🌗</button>
  </div>
</div>

<div id="setsContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getFirestore, 
    doc, 
    onSnapshot, 
    setDoc, 
    updateDoc 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdTht0Qu-J_SJSzotwM6fMYR4PAFVj63s",
    authDomain: "mind-training-f1b2b.firebaseapp.com",
    projectId: "mind-training-f1b2b",
    storageBucket: "mind-training-f1b2b.firebasestorage.app",
    messagingSenderId: "1021385760984",
    appId: "1:1021385760984:web:154f647b1fc90c34fef7ad",
    measurementId: "G-CVNPF4YL6B"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const DOC_ID = "memory_practice_mixed_dynamic";
  const docRef = doc(db, "memory_practice", DOC_ID);

  const container = document.getElementById("setsContainer");
  const statusIndicator = document.getElementById("statusIndicator");
  const globalCounter = document.getElementById("globalCounter");
  const inputCount = document.getElementById("itemCount");
  const speakSpeedInput = document.getElementById("speakSpeed");
  const btnTheme = document.getElementById("btn-theme");
  const btnExpand = document.getElementById("btn-expand");
  const btnCollapse = document.getElementById("btn-collapse");

  const audioState = {}; 
  const foldedState = {}; 

  // --- THEME LOGIC ---
  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
    }
  }
  
  btnTheme.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  });

  initTheme();

  // --- EXPAND / COLLAPSE LOGIC ---
  btnExpand.addEventListener('click', () => {
    document.querySelectorAll('.set').forEach(el => {
      el.classList.remove('collapsed');
      el.classList.add('expanded');
      // Update state logic so it persists if we re-render (roughly)
      const key = el.id.replace('section-', '');
      foldedState[key] = false;
    });
  });

  btnCollapse.addEventListener('click', () => {
    document.querySelectorAll('.set').forEach(el => {
      el.classList.remove('expanded');
      el.classList.add('collapsed');
      const key = el.id.replace('section-', '');
      foldedState[key] = true;
    });
  });


  // --- AUDIO & GENERATION LOGIC ---
  const symbolMap = {
    '!': 'Exclamation', '@': 'At', '#': 'Hash', '$': 'Dollar',
    '%': 'Percent', '^': 'Caret', '&': 'Ampersand', '*': 'Asterisk',
    '(': 'Open Paren', ')': 'Close Paren', '-': 'Dash', '_': 'Underscore',
    '+': 'Plus', '=': 'Equals', '{': 'Open Brace', '}': 'Close Brace',
    '[': 'Open Bracket', ']': 'Close Bracket', '|': 'Pipe', '\\': 'Backslash',
    ':': 'Colon', ';': 'Semicolon', '"': 'Quote', '\'': 'Apostrophe',
    '<': 'Less Than', '>': 'Greater Than', ',': 'Comma', '.': 'Dot',
    '?': 'Question', '/': 'Slash'
  };

  function speakText(text) {
    const chars = text.split('');
    const spokenWords = chars.map(char => {
      if (symbolMap[char]) return symbolMap[char];
      return char; 
    });
    const utteranceText = spokenWords.join(', ');

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(utteranceText);
      utterance.rate = parseFloat(speakSpeedInput.value);
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }
  }

  function generateMixedString(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*-_+/";
    let result = "";
    for(let i=0; i<length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  function generateNewDataset(count) {
    const categories = [
      "6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed",
      "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"
    ];
    
    const newDataset = {};
    categories.forEach(cat => {
      const len = parseInt(cat.split('-')[0]);
      const list = [];
      for(let i=0; i<count; i++) {
        list.push(generateMixedString(len));
      }
      newDataset[cat] = list;
    });

    return { dataset: newDataset, completed: {} };
  }

  let currentData = null;

  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      statusIndicator.textContent = "Synced with cloud";
      statusIndicator.style.color = "var(--status-connected)";
      
      const fullData = docSnap.data();
      currentData = fullData.dataset;
      
      if (currentData && currentData['6-mixed']) {
        const actualCount = currentData['6-mixed'].length;
        if (actualCount > 0) inputCount.value = actualCount;
      }
      
      renderAll(fullData.dataset, fullData.completed || {});
    } else {
      statusIndicator.textContent = "Initializing database...";
      const initialData = generateNewDataset(50);
      setDoc(docRef, initialData);
    }
  }, (error) => {
    console.error("Firebase Error:", error);
    statusIndicator.textContent = "Error connecting to cloud.";
    statusIndicator.style.color = "var(--status-error)";
  });

  function renderAll(dataset, completedMap) {
    container.innerHTML = "";
    let totalItems = 0;
    let totalDone = 0;

    const order = [
      "6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed",
      "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"
    ];

    order.forEach(setKey => {
      const items = dataset[setKey];
      if (!items) return;

      totalItems += items.length;
      let sectionDone = 0;

      const setDiv = document.createElement("div");
      setDiv.className = "set expanded"; 
      setDiv.id = `section-${setKey}`;

      if (foldedState[setKey] === true) {
        setDiv.className = "set collapsed";
      }

      const headerDiv = document.createElement("div");
      headerDiv.className = "set-header";
      
      const titleText = document.createElement("div");
      titleText.className = "set-title-text";
      titleText.innerHTML = `<span class="chevron"></span> ${setKey}`;
      
      headerDiv.onclick = (e) => {
        if (e.target.tagName !== 'BUTTON') {
            const isCollapsed = setDiv.classList.contains("collapsed");
            if (isCollapsed) {
                setDiv.classList.remove("collapsed");
                setDiv.classList.add("expanded");
                foldedState[setKey] = false;
            } else {
                setDiv.classList.remove("expanded");
                setDiv.classList.add("collapsed");
                foldedState[setKey] = true;
            }
        }
      };

      const btnAudio = document.createElement("button");
      btnAudio.className = "btn-audio-toggle";
      const isAudioOn = audioState[setKey] === true;
      if (isAudioOn) {
        btnAudio.classList.add("active");
        btnAudio.innerHTML = "🔊 On";
      } else {
        btnAudio.innerHTML = "🔇 Off";
      }
      btnAudio.onclick = (e) => {
        e.stopPropagation(); 
        audioState[setKey] = !audioState[setKey];
        if (audioState[setKey]) {
          btnAudio.classList.add("active");
          btnAudio.innerHTML = "🔊 On";
        } else {
          btnAudio.classList.remove("active");
          btnAudio.innerHTML = "🔇 Off";
        }
      };

      const btnReset = document.createElement("button");
      btnReset.className = "btn-set-reset";
      btnReset.textContent = "Reset";
      btnReset.onclick = (e) => {
        e.stopPropagation(); 
        resetSection(setKey, items.length);
      }

      const counterDiv = document.createElement("div");
      counterDiv.className = "counter";
      
      const contentDiv = document.createElement("div");
      contentDiv.className = "set-content";

      const ul = document.createElement("ul");
      
      items.forEach((val, index) => {
        const li = document.createElement("li");
        li.textContent = val;
        const uid = `${setKey}-${index}`;

        if (completedMap[uid]) {
          li.classList.add("completed");
          sectionDone++;
        }

        li.addEventListener("click", () => {
          if (audioState[setKey]) {
            speakText(val);
          }
          toggleItem(uid, li);
        });
        
        ul.appendChild(li);
      });

      counterDiv.textContent = `${sectionDone} / ${items.length}`;
      
      headerDiv.appendChild(titleText);
      headerDiv.appendChild(counterDiv);
      headerDiv.appendChild(btnAudio);
      headerDiv.appendChild(btnReset);
      
      contentDiv.appendChild(ul);
      
      setDiv.appendChild(headerDiv);
      setDiv.appendChild(contentDiv);
      
      container.appendChild(setDiv);
      totalDone += sectionDone;
    });

    globalCounter.textContent = `Total Completed: ${totalDone} / ${totalItems}`;
  }

  async function toggleItem(uid, li) {
    const isNowComplete = !li.classList.contains("completed");
    if(isNowComplete) li.classList.add("completed");
    else li.classList.remove("completed");

    await updateDoc(docRef, {
      [`completed.${uid}`]: isNowComplete
    });
  }

  async function resetSection(setKey, count) {
    if(!confirm(`Reset ${setKey}?`)) return;
    const updates = {};
    for(let i=0; i<count; i++) {
      updates[`completed.${setKey}-${i}`] = false;
    }
    await updateDoc(docRef, updates);
  }

  async function resetAllProgress() {
    if(!confirm("Reset ALL progress? Items will stay the same.")) return;
    await updateDoc(docRef, { completed: {} });
  }

  async function regenerateAll() {
    const count = parseInt(inputCount.value) || 50;
    if(!confirm(`WARNING: This will generate NEW mixed strings (${count} per section) and WIPE progress.`)) return;
    
    statusIndicator.textContent = "Regenerating...";
    const newData = generateNewDataset(count);
    await setDoc(docRef, newData);
  }

  window.copyAll = function() {
    if(!currentData) return;
    let text = "";
    const order = ["6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed", "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"];
    order.forEach(key => {
      if(currentData[key]) {
        text += key + ":\n" + currentData[key].join(" ") + "\n\n";
      }
    });
    navigator.clipboard.writeText(text);
    alert("Copied to clipboard!");
  }

  window.downloadTxt = function() {
    if(!currentData) return;
    let text = "";
    const order = ["6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed", "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"];
    order.forEach(key => {
      if(currentData[key]) {
        text += key + ":\n" + currentData[key].join(" ") + "\n\n";
      }
    });
    const blob = new Blob([text], {type: "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "mixed_sets.txt";
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById('btn-reset').addEventListener('click', resetAllProgress);
  document.getElementById('btn-regen').addEventListener('click', regenerateAll);
  document.getElementById('btn-copy').addEventListener('click', window.copyAll);
  document.getElementById('btn-download').addEventListener('click', window.downloadTxt);

</script>

</body>
</html>
