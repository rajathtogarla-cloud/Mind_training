<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cloud Mixed Practice (Button Fix)</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 10px; 
      background: #ffffff;
      color: #333;
      -webkit-text-size-adjust: 100%;
    }
    h1 { 
      text-align: center; 
      color: #1e3a8a; 
      margin-bottom: 10px;
      font-size: 1.5em;
    }
    .status-bar {
      text-align: center;
      font-size: 0.85em;
      color: #6b7280;
      margin-bottom: 15px;
      height: 20px;
    }
    
    /* --- Controls --- */
    .controls { 
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      margin: 10px auto; 
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      max-width: 900px;
      border: 1px solid #e2e8f0;
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
    }

    input[type="number"] {
      border: 1px solid #cbd5e1;
      padding: 8px;
      border-radius: 4px;
      width: 60px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }
    input[type="range"] {
      width: 100px;
      cursor: pointer;
    }
    
    button { 
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    
    #btn-reset { background: #dc2626; } 
    #btn-copy { background: #2563eb; } 
    #btn-download { background: #16a34a; } 
    #btn-regen { background: #b91c1c; border: 1px solid #991b1b; } 
    .btn-secondary { background: #64748b; }

    /* --- SECTION & DROPDOWN STYLING --- */
    .set { 
      margin-top: 15px; 
      background: #f1f5f9; 
      border-radius: 8px; 
      border: 1px solid #e2e8f0;
      overflow: hidden; 
    }
    
    .set-header {
      padding: 12px 10px;
      background: #eef2ff; 
      display: flex;
      align-items: center;
      flex-wrap: nowrap; 
      justify-content: space-between;
      gap: 8px;
      cursor: pointer; 
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background 0.2s;
    }
    .set-header:hover {
      background: #e0e7ff;
    }
    
    .set.expanded .set-header {
      border-bottom: 1px solid #e2e8f0;
    }

    /* Arrow icon */
    .chevron {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-right: 3px solid #2563eb;
      border-bottom: 3px solid #2563eb;
      transform: rotate(45deg); 
      transition: transform 0.2s;
      margin-right: 5px;
      margin-bottom: 3px;
      flex-shrink: 0;
    }
    
    .set.collapsed .chevron {
      transform: rotate(45deg) rotate(-90deg); 
    }

    .set-title-text {
      color: #2563eb; 
      font-weight: bold;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      white-space: nowrap; 
      flex-grow: 1; /* Pushes other items to right, but doesn't force buttons to shrink */
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .set-content {
      padding: 15px;
      display: block;
    }
    
    .set.collapsed .set-content {
      display: none;
    }

    ul { list-style: none; padding: 0; text-align: center; margin: 0; }
    
    li { 
      display: inline-block;
      margin: 6px; 
      padding: 12px 16px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      background: #ffffff;
      transition: all 0.1s;
      user-select: none;
      cursor: pointer;
      font-family: "Courier New", Courier, monospace; 
      font-size: 18px; 
      font-weight: 600;               
      color: #334155;     
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    li:active { transform: scale(0.96); background: #f1f5f9; }
    
    li.completed { 
      background: #bbf7d0 !important; 
      color: #065f46 !important; 
      border-color: #86efac;
    }

    /* Buttons inside header */
    .counter { 
      font-family: Arial, sans-serif;
      font-size: 0.8em;
      font-weight: normal; 
      color: #16a34a;
      background: #fff;
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      white-space: nowrap;
    }

    .btn-set-reset { 
      background: white; 
      border: 1px solid #9ca3af; 
      border-radius: 4px; 
      padding: 6px 10px; 
      color: #374151;
      font-size: 0.8em;
      white-space: nowrap;
    }

    .btn-audio-toggle {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      color: #64748b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-audio-toggle.active {
      background: #3b82f6;
      color: white;
      border-color: #2563eb;
    }

    /* --- MOBILE STYLES --- */
    @media (max-width: 600px) {
      .controls { flex-direction: column; width: 90%; }
      .control-group { width: 100%; justify-content: center; }
      
      /* FIX: Only stretch buttons inside the control panel, NOT the header */
      .controls button { 
        width: 100%; 
        margin-bottom: 5px; 
      }
      
      li { width: 90%; margin: 8px auto; text-align: center; font-size: 20px; display: block; }
      
      /* Mobile Header Tweaks */
      .set-header { gap: 5px; }
      .set-title-text { font-size: 1em; }
      
      /* Explicitly keep header buttons small/auto width */
      .btn-audio-toggle, 
      .btn-set-reset {
        width: auto; 
        font-size: 0.7em;
        padding: 4px 8px;
      }
      .counter {
        font-size: 0.7em;
        padding: 3px 6px;
      }
    }
  </style>
</head>
<body>

<h1>Mixed Combinations (Button Fix)</h1>
<div class="status-bar" id="statusIndicator">Connecting to cloud...</div>

<div class="controls">
  <div style="width: 100%; text-align: center; margin-bottom: 10px; color: #1e3a8a; font-weight: bold; font-family: Arial;" id="globalCounter">
    Loading...
  </div>
  
  <button id="btn-reset">Reset Progress</button>
  <div style="display:flex; gap:5px; width:100%;">
    <button id="btn-copy" class="btn-secondary" style="flex:1;">Copy</button>
    <button id="btn-download" class="btn-secondary" style="flex:1;">Download</button>
  </div>
  
  <div class="control-group">
    <label for="speakSpeed" style="font-size: 0.9em; color: #333;">Voice Speed:</label>
    <input type="range" id="speakSpeed" min="0.5" max="1.5" step="0.1" value="0.9">
  </div>
  
  <div class="control-group">
    <label for="itemCount" style="font-size: 0.9em; color: #333;">Items:</label>
    <input type="number" id="itemCount" value="50" min="10" max="200">
  </div>
  <button id="btn-regen">Regenerate</button>
</div>

<div id="setsContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getFirestore, 
    doc, 
    onSnapshot, 
    setDoc, 
    updateDoc 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdTht0Qu-J_SJSzotwM6fMYR4PAFVj63s",
    authDomain: "mind-training-f1b2b.firebaseapp.com",
    projectId: "mind-training-f1b2b",
    storageBucket: "mind-training-f1b2b.firebasestorage.app",
    messagingSenderId: "1021385760984",
    appId: "1:1021385760984:web:154f647b1fc90c34fef7ad",
    measurementId: "G-CVNPF4YL6B"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const DOC_ID = "memory_practice_mixed_dynamic";
  const docRef = doc(db, "memory_practice", DOC_ID);

  const container = document.getElementById("setsContainer");
  const statusIndicator = document.getElementById("statusIndicator");
  const globalCounter = document.getElementById("globalCounter");
  const inputCount = document.getElementById("itemCount");
  const speakSpeedInput = document.getElementById("speakSpeed");

  const audioState = {}; 
  const foldedState = {}; 

  const symbolMap = {
    '!': 'Exclamation', '@': 'At', '#': 'Hash', '$': 'Dollar',
    '%': 'Percent', '^': 'Caret', '&': 'Ampersand', '*': 'Asterisk',
    '(': 'Open Paren', ')': 'Close Paren', '-': 'Dash', '_': 'Underscore',
    '+': 'Plus', '=': 'Equals', '{': 'Open Brace', '}': 'Close Brace',
    '[': 'Open Bracket', ']': 'Close Bracket', '|': 'Pipe', '\\': 'Backslash',
    ':': 'Colon', ';': 'Semicolon', '"': 'Quote', '\'': 'Apostrophe',
    '<': 'Less Than', '>': 'Greater Than', ',': 'Comma', '.': 'Dot',
    '?': 'Question', '/': 'Slash'
  };

  function speakText(text) {
    const chars = text.split('');
    const spokenWords = chars.map(char => {
      if (symbolMap[char]) return symbolMap[char];
      return char; 
    });
    const utteranceText = spokenWords.join(', ');

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(utteranceText);
      utterance.rate = parseFloat(speakSpeedInput.value);
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }
  }

  function generateMixedString(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*-_+/";
    let result = "";
    for(let i=0; i<length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  function generateNewDataset(count) {
    const categories = [
      "6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed",
      "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"
    ];
    
    const newDataset = {};
    categories.forEach(cat => {
      const len = parseInt(cat.split('-')[0]);
      const list = [];
      for(let i=0; i<count; i++) {
        list.push(generateMixedString(len));
      }
      newDataset[cat] = list;
    });

    return { dataset: newDataset, completed: {} };
  }

  let currentData = null;

  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      statusIndicator.textContent = "Synced with cloud";
      statusIndicator.style.color = "#16a34a";
      
      const fullData = docSnap.data();
      currentData = fullData.dataset;
      
      if (currentData && currentData['6-mixed']) {
        const actualCount = currentData['6-mixed'].length;
        if (actualCount > 0) inputCount.value = actualCount;
      }
      
      renderAll(fullData.dataset, fullData.completed || {});
    } else {
      statusIndicator.textContent = "Initializing database...";
      const initialData = generateNewDataset(50);
      setDoc(docRef, initialData);
    }
  }, (error) => {
    console.error("Firebase Error:", error);
    statusIndicator.textContent = "Error connecting to cloud.";
    statusIndicator.style.color = "#dc2626";
  });

  function renderAll(dataset, completedMap) {
    container.innerHTML = "";
    let totalItems = 0;
    let totalDone = 0;

    const order = [
      "6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed",
      "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"
    ];

    order.forEach(setKey => {
      const items = dataset[setKey];
      if (!items) return;

      totalItems += items.length;
      let sectionDone = 0;

      const setDiv = document.createElement("div");
      setDiv.className = "set expanded"; 
      setDiv.id = `section-${setKey}`;

      if (foldedState[setKey] === true) {
        setDiv.className = "set collapsed";
      }

      const headerDiv = document.createElement("div");
      headerDiv.className = "set-header";
      
      const titleText = document.createElement("div");
      titleText.className = "set-title-text";
      titleText.innerHTML = `<span class="chevron"></span> ${setKey}`;
      
      headerDiv.onclick = (e) => {
        if (e.target.tagName !== 'BUTTON') {
            const isCollapsed = setDiv.classList.contains("collapsed");
            if (isCollapsed) {
                setDiv.classList.remove("collapsed");
                setDiv.classList.add("expanded");
                foldedState[setKey] = false;
            } else {
                setDiv.classList.remove("expanded");
                setDiv.classList.add("collapsed");
                foldedState[setKey] = true;
            }
        }
      };

      const btnAudio = document.createElement("button");
      btnAudio.className = "btn-audio-toggle";
      const isAudioOn = audioState[setKey] === true;
      if (isAudioOn) {
        btnAudio.classList.add("active");
        btnAudio.innerHTML = "🔊 On";
      } else {
        btnAudio.innerHTML = "🔇 Off";
      }
      btnAudio.onclick = (e) => {
        e.stopPropagation(); 
        audioState[setKey] = !audioState[setKey];
        if (audioState[setKey]) {
          btnAudio.classList.add("active");
          btnAudio.innerHTML = "🔊 On";
        } else {
          btnAudio.classList.remove("active");
          btnAudio.innerHTML = "🔇 Off";
        }
      };

      const btnReset = document.createElement("button");
      btnReset.className = "btn-set-reset";
      btnReset.textContent = "Reset";
      btnReset.onclick = (e) => {
        e.stopPropagation(); 
        resetSection(setKey, items.length);
      }

      const counterDiv = document.createElement("div");
      counterDiv.className = "counter";
      
      const contentDiv = document.createElement("div");
      contentDiv.className = "set-content";

      const ul = document.createElement("ul");
      
      items.forEach((val, index) => {
        const li = document.createElement("li");
        li.textContent = val;
        const uid = `${setKey}-${index}`;

        if (completedMap[uid]) {
          li.classList.add("completed");
          sectionDone++;
        }

        li.addEventListener("click", () => {
          if (audioState[setKey]) {
            speakText(val);
          }
          toggleItem(uid, li);
        });
        
        ul.appendChild(li);
      });

      counterDiv.textContent = `${sectionDone} / ${items.length}`;
      
      headerDiv.appendChild(titleText);
      headerDiv.appendChild(counterDiv);
      headerDiv.appendChild(btnAudio);
      headerDiv.appendChild(btnReset);
      
      contentDiv.appendChild(ul);
      
      setDiv.appendChild(headerDiv);
      setDiv.appendChild(contentDiv);
      
      container.appendChild(setDiv);
      totalDone += sectionDone;
    });

    globalCounter.textContent = `Total Completed: ${totalDone} / ${totalItems}`;
  }

  async function toggleItem(uid, li) {
    const isNowComplete = !li.classList.contains("completed");
    if(isNowComplete) li.classList.add("completed");
    else li.classList.remove("completed");

    await updateDoc(docRef, {
      [`completed.${uid}`]: isNowComplete
    });
  }

  async function resetSection(setKey, count) {
    if(!confirm(`Reset ${setKey}?`)) return;
    const updates = {};
    for(let i=0; i<count; i++) {
      updates[`completed.${setKey}-${i}`] = false;
    }
    await updateDoc(docRef, updates);
  }

  async function resetAllProgress() {
    if(!confirm("Reset ALL progress? Items will stay the same.")) return;
    await updateDoc(docRef, { completed: {} });
  }

  async function regenerateAll() {
    const count = parseInt(inputCount.value) || 50;
    if(!confirm(`WARNING: This will generate NEW mixed strings (${count} per section) and WIPE progress.`)) return;
    
    statusIndicator.textContent = "Regenerating...";
    const newData = generateNewDataset(count);
    await setDoc(docRef, newData);
  }

  window.copyAll = function() {
    if(!currentData) return;
    let text = "";
    const order = ["6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed", "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"];
    order.forEach(key => {
      if(currentData[key]) {
        text += key + ":\n" + currentData[key].join(" ") + "\n\n";
      }
    });
    navigator.clipboard.writeText(text);
    alert("Copied to clipboard!");
  }

  window.downloadTxt = function() {
    if(!currentData) return;
    let text = "";
    const order = ["6-mixed", "7-mixed", "8-mixed", "9-mixed", "10-mixed", "11-mixed", "12-mixed", "13-mixed", "14-mixed", "15-mixed"];
    order.forEach(key => {
      if(currentData[key]) {
        text += key + ":\n" + currentData[key].join(" ") + "\n\n";
      }
    });
    const blob = new Blob([text], {type: "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "mixed_sets.txt";
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById('btn-reset').addEventListener('click', resetAllProgress);
  document.getElementById('btn-regen').addEventListener('click', regenerateAll);
  document.getElementById('btn-copy').addEventListener('click', window.copyAll);
  document.getElementById('btn-download').addEventListener('click', window.downloadTxt);

</script>

</body>
</html>
